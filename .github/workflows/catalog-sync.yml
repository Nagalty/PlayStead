name: Canonical catalog

on:
  workflow_dispatch:
    inputs:
      publish-pages:
        description: "Deploy the validated catalog to GitHub Pages"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore catalog builder
        run: dotnet restore tools/PlayStead.CatalogBuilder/PlayStead.CatalogBuilder.csproj
      - name: Build catalog builder
        run: dotnet build tools/PlayStead.CatalogBuilder/PlayStead.CatalogBuilder.csproj -c Release --no-restore -p:UseSharedCompilation=false
      - name: Generate catalog
        shell: bash
        run: |
          test -n "$IGDB_CLIENT_ID"
          test -n "$IGDB_CLIENT_SECRET"
          dotnet tools/PlayStead.CatalogBuilder/bin/Release/net10.0/PlayStead.CatalogBuilder.dll \
            --igdb --output "$RUNNER_TEMP/catalog" --catalog-version "$GITHUB_RUN_NUMBER"
      - name: Validate public artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, os
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "catalog"
          manifest = json.loads((root / "catalog-manifest.json").read_text())
          compressed_payload = root / "catalog-payload.json.gz"
          compressed_bytes = compressed_payload.read_bytes()
          payload_bytes = gzip.decompress(compressed_bytes)
          payload_text = payload_bytes.decode("utf-8")
          digest = hashlib.sha256(compressed_bytes).hexdigest().upper()
          payload_document = json.loads(payload_text)
          actual_schema = manifest.get("schemaVersion")
          actual_encoding = manifest.get("payloadEncoding")
          actual_hash = manifest.get("payloadSha256", "").upper()
          actual_size = manifest.get("payloadSizeBytes")
          actual_manifest_count = manifest.get("entryCount")
          actual_payload_count = len(payload_document.get("entries", []))
          secret_found = "IGDB_CLIENT_SECRET" in payload_text
          def redact(value):
              value = str(value)
              for secret_name in ("IGDB_CLIENT_ID", "IGDB_CLIENT_SECRET"):
                  secret = os.environ.get(secret_name)
                  if secret:
                      value = value.replace(secret, "[redacted]")
              return value[:240] + ("..." if len(value) > 240 else "")
          def find_file_uri(value, path=""):
              if isinstance(value, str):
                  return (path, value) if "file://" in value.lower() else None
              if isinstance(value, dict):
                  for key, child in value.items():
                      found = find_file_uri(child, f"{path}.{key}" if path else key)
                      if found:
                          return found
              if isinstance(value, list):
                  for index, child in enumerate(value):
                      found = find_file_uri(child, f"{path}[{index}]")
                      if found:
                          return found
              return None
          match = None
          for index, entry in enumerate(payload_document.get("entries", [])):
              if not isinstance(entry, dict):
                  continue
              match = find_file_uri(entry.get("providerReferences", []), "providerReferences")
              if match:
                  title = entry.get("canonicalTitle", "")
                  print(f"CATALOG_FILE_URI_MATCH_INDEX={index}")
                  print(f"CATALOG_FILE_URI_MATCH_TITLE={redact(title)}")
                  print(f"CATALOG_FILE_URI_MATCH_FIELD={match[0]}")
                  print(f"CATALOG_FILE_URI_MATCH_VALUE={redact(match[1])}")
                  break
          file_uri_found = match is not None
          print(f"CATALOG_SCHEMA_VERSION={actual_schema}")
          print(f"CATALOG_COMPRESSED_PAYLOAD={actual_encoding == 'gzip'}")
          print(f"CATALOG_HASH_MATCH={actual_hash == digest}")
          print(f"CATALOG_SIZE_MATCH={actual_size == len(compressed_bytes)}")
          print(f"CATALOG_ENTRY_COUNT_MANIFEST={actual_manifest_count}")
          print(f"CATALOG_ENTRY_COUNT_PAYLOAD={actual_payload_count}")
          print(f"CATALOG_SECRET_SCAN={'FAIL' if secret_found else 'PASS'}")
          print(f"CATALOG_FILE_URI_SCAN={'FAIL' if file_uri_found else 'PASS'}")
          def require(label, expected, actual):
              if expected != actual:
                  raise AssertionError(f"{label}: expected={expected!r} actual={actual!r}")
          require("schemaVersion", 2, actual_schema)
          require("payloadEncoding", "gzip", actual_encoding)
          require("payloadSha256", digest, actual_hash)
          require("payloadSizeBytes", len(compressed_bytes), actual_size)
          require("payloadUncompressedSizeBytes", len(payload_bytes), manifest.get("payloadUncompressedSizeBytes"))
          require("entryCount", actual_manifest_count, actual_payload_count)
          require("secret scan", False, secret_found)
          require("file URI scan", False, file_uri_found)
          PY
      - name: Prepare GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/pages-site"
          version="$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.argv[1])); process.stdout.write(String(m.catalogVersion));' "$RUNNER_TEMP/catalog/catalog-manifest.json")"
          mkdir -p "$site/catalog/versions/$version"
          cp "$RUNNER_TEMP/catalog/catalog-manifest.json" "$site/catalog/catalog-manifest.json"
          cp "$RUNNER_TEMP/catalog/catalog-payload.json.gz" "$site/catalog/catalog-payload.json.gz"
          cp "$RUNNER_TEMP/catalog/catalog-manifest.json" "$site/catalog/versions/$version/catalog-manifest.json"
          cp "$RUNNER_TEMP/catalog/catalog-payload.json.gz" "$site/catalog/versions/$version/catalog-payload.json.gz"
          test -f "$site/catalog/catalog-manifest.json"
          test -f "$site/catalog/catalog-payload.json.gz"
          test -f "$site/catalog/versions/$version/catalog-manifest.json"
          test -f "$site/catalog/versions/$version/catalog-payload.json.gz"
          echo "PAGES_CURRENT_MANIFEST=PASS"
          echo "PAGES_CURRENT_PAYLOAD=PASS"
          echo "PAGES_VERSIONED_MANIFEST=PASS"
          echo "PAGES_VERSIONED_PAYLOAD=PASS"
          echo "PAGES_LAYOUT=PASS"
      - name: Validate prepared Pages site
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/pages-site" python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["SITE"]) / "catalog"
          manifest = json.loads((root / "catalog-manifest.json").read_text())
          compressed = (root / manifest["payloadUrl"]).read_bytes()
          assert manifest["schemaVersion"] == 2
          assert manifest["payloadEncoding"] == "gzip"
          assert manifest["payloadSha256"].upper() == hashlib.sha256(compressed).hexdigest().upper()
          assert manifest["payloadSizeBytes"] == len(compressed)
          uncompressed = gzip.decompress(compressed)
          assert manifest["payloadUncompressedSizeBytes"] == len(uncompressed)
          assert manifest["entryCount"] == len(json.loads(uncompressed)["entries"])
          version = str(manifest["catalogVersion"])
          versioned = root / "versions" / version
          assert (versioned / "catalog-manifest.json").read_bytes() == (root / "catalog-manifest.json").read_bytes()
          assert (versioned / "catalog-payload.json.gz").read_bytes() == compressed
          print("PAGES_MANIFEST_HASH_VALID=PASS")
          print("PAGES_LAYOUT_VALID=PASS")
          PY
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
      - name: Upload validated catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstead-catalog-${{ github.run_number }}
          path: ${{ runner.temp }}/catalog
          retention-days: 90

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs['publish-pages'] == true }}
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public catalog
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagalty.github.io/PlayStead"
          manifest_url="$base/catalog/catalog-manifest.json"
          curl --fail --silent --show-error "$manifest_url" -o "$RUNNER_TEMP/public-manifest.json"
          test "$(jq -r '.schemaVersion' "$RUNNER_TEMP/public-manifest.json")" = "2"
          payload_url="$base/catalog/$(jq -r '.payloadUrl' "$RUNNER_TEMP/public-manifest.json")"
          curl --fail --silent --show-error "$payload_url" -o "$RUNNER_TEMP/public-payload.gz"
          jq -e --arg sha "$(sha256sum "$RUNNER_TEMP/public-payload.gz" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')" '.payloadSha256 == $sha' "$RUNNER_TEMP/public-manifest.json"
          echo "PUBLIC_CATALOG_HTTP=PASS"
