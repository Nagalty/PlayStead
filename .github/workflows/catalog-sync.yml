name: Canonical catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore catalog builder
        run: dotnet restore tools/PlayStead.CatalogBuilder/PlayStead.CatalogBuilder.csproj
      - name: Build catalog builder
        run: dotnet build tools/PlayStead.CatalogBuilder/PlayStead.CatalogBuilder.csproj -c Release --no-restore -p:UseSharedCompilation=false
      - name: Generate catalog
        shell: bash
        run: |
          test -n "$IGDB_CLIENT_ID"
          test -n "$IGDB_CLIENT_SECRET"
          dotnet tools/PlayStead.CatalogBuilder/bin/Release/net10.0/PlayStead.CatalogBuilder.dll \
            --igdb --output "$RUNNER_TEMP/catalog" --catalog-version "$GITHUB_RUN_NUMBER"
      - name: Validate public artifact
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, os
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "catalog"
          manifest = json.loads((root / "catalog-manifest.json").read_text())
          payload = root / "catalog-payload.json"
          payload_bytes = payload.read_bytes()
          payload_text = payload_bytes.decode("utf-8")
          digest = hashlib.sha256(payload_bytes).hexdigest().upper()
          payload_document = json.loads(payload_text)
          actual_schema = manifest.get("schemaVersion")
          actual_hash = manifest.get("payloadSha256", "").upper()
          actual_size = manifest.get("payloadSizeBytes")
          actual_manifest_count = manifest.get("entryCount")
          actual_payload_count = len(payload_document.get("entries", []))
          secret_found = "IGDB_CLIENT_SECRET" in payload_text
          file_uri_found = "file://" in payload_text.lower()
          print(f"CATALOG_SCHEMA_VERSION={actual_schema}")
          print(f"CATALOG_HASH_MATCH={actual_hash == digest}")
          print(f"CATALOG_SIZE_MATCH={actual_size == len(payload_bytes)}")
          print(f"CATALOG_ENTRY_COUNT_MANIFEST={actual_manifest_count}")
          print(f"CATALOG_ENTRY_COUNT_PAYLOAD={actual_payload_count}")
          print(f"CATALOG_SECRET_SCAN={'FAIL' if secret_found else 'PASS'}")
          print(f"CATALOG_FILE_URI_SCAN={'FAIL' if file_uri_found else 'PASS'}")
          def require(label, expected, actual):
              if expected != actual:
                  raise AssertionError(f"{label}: expected={expected!r} actual={actual!r}")
          require("schemaVersion", 1, actual_schema)
          require("payloadSha256", digest, actual_hash)
          require("payloadSizeBytes", len(payload_bytes), actual_size)
          require("entryCount", actual_manifest_count, actual_payload_count)
          require("secret scan", False, secret_found)
          require("file URI scan", False, file_uri_found)
          PY
      - name: Upload validated catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: playstead-catalog-${{ github.run_number }}
          path: ${{ runner.temp }}/catalog
          retention-days: 90
